<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Game Background Vibe</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars to make it look like a full-screen game */
            background-color: #000; /* Fallback color */
            font-family: 'Inter', sans-serif;
            color: white;
        }

        #video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1; /* Keep the video behind the content */
            object-fit: cover; /* Ensure video covers the whole screen */
            /* Add a subtle dark overlay to make text more readable */
            filter: brightness(0.6); 
        }

        .game-ui {
            /* Basic styling for the game UI overlay */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through the general UI container */
        }
        
        .interactive-element {
            pointer-events: auto; /* Make specific elements clickable */
        }

        /* Glassmorphism effect for panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- You can change the 'src' here to your preferred video file later -->
    <video autoplay muted loop id="video-background">
        <!-- Using a placeholder video URL. Replace this with your own local file path (e.g., 'my-game-bg.mp4') -->
        <source src="Looping.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <div class="game-ui p-6">
        
        <!-- Top bar: Player info and Stats -->
        <div class="flex justify-between items-start w-full">
            <div class="glass-panel p-4 rounded-xl flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-500 border-2 border-white flex items-center justify-center text-xl font-bold">
                    P1
                </div>
                <div>
                    <h2 class="font-bold text-lg leading-tight">Player_One</h2>
                    <p class="text-sm text-gray-300">Level 42</p>
                </div>
            </div>

            <div class="glass-panel p-4 rounded-xl flex gap-6">
                 <div class="text-center">
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Score</p>
                    <p class="text-xl font-mono">14,250</p>
                </div>
                 <div class="text-center">
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Time</p>
                    <p class="text-xl font-mono text-yellow-400">12:45</p>
                </div>
            </div>
        </div>

        <!-- Center Action / Message -->
        <div class="text-center">
            <h1 class="text-5xl font-extrabold tracking-widest uppercase drop-shadow-lg mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                Mission Active
            </h1>
            <p class="text-lg text-gray-200 drop-shadow-md">Survive the incoming waves</p>
        </div>

        <!-- Bottom bar: Controls / Menu -->
        <div class="flex justify-center gap-4 pb-4">
            <button class="interactive-element glass-panel px-8 py-3 rounded-full hover:bg-white/20 transition-all duration-300 font-semibold tracking-wide flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287-.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                </svg>
                Settings
            </button>
            <button class="interactive-element px-8 py-3 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 transition-all duration-300 font-bold tracking-wide shadow-lg shadow-blue-500/50">
                START GAME
            </button>
             <button class="interactive-element glass-panel px-8 py-3 rounded-full hover:bg-white/20 transition-all duration-300 font-semibold tracking-wide flex items-center gap-2">
                Inventory
            </button>
        </div>
    </div>

    <script>
        // Simple script to handle button clicks for demonstration
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', () => {
                // We use a custom message box instead of alert() as per instructions
                const msgBox = document.createElement('div');
                msgBox.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white p-6 rounded-xl border border-gray-600 z-50 text-center glass-panel interactive-element';
                msgBox.innerHTML = `
                    <h3 class="text-xl font-bold mb-4">${button.innerText} Clicked!</h3>
                    <p class="mb-4">This is a placeholder action.</p>
                    <button class="px-6 py-2 bg-blue-600 rounded-lg hover:bg-blue-500 transition-colors" onclick="this.parentElement.remove()">Close</button>
                `;
                document.body.appendChild(msgBox);
            });
        });
    </script>
</body>
</html>
