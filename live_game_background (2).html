<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Game Background Vibe - 9:16 Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: white;
            /* Background for the desktop area outside the 9:16 container */
            background-color: #1a1a2e; 
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        }

        /* Glassmorphism effect for panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .interactive-element {
            pointer-events: auto; /* Make specific elements clickable */
        }

        /* Pulsing animation for the main start button */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(59, 130, 246, 0.8); transform: scale(1.02); }
        }
        .btn-pulse {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- 
      Main Game Container: 
      - On mobile: width and height are full screen.
      - On larger screens (sm and up): maintains a 9:16 aspect ratio, looks like a mobile device.
    -->
    <div class="relative w-full h-screen sm:h-[90vh] sm:aspect-[9/16] sm:max-h-[900px] overflow-hidden sm:rounded-[2.5rem] shadow-2xl bg-black flex flex-col justify-between sm:border-[6px] border-gray-800">
        
        <!-- Video Background constrained to the 9:16 container -->
        <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover z-0 filter brightness-50">
            <!-- Using a placeholder video URL. Replace this with your own local file path -->
            <source src="Subtle Looping Background Video.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>

        <!-- UI Overlay -->
        <div class="relative z-10 flex flex-col justify-between h-full w-full p-4 sm:p-5 pointer-events-none">
            
            <!-- Top section: Compact for mobile -->
            <div class="flex justify-between items-start w-full mt-2">
                
                <!-- Player Info -->
                <div class="glass-panel p-2 pr-4 rounded-full flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-500 border-2 border-white flex items-center justify-center text-sm font-bold shadow-lg shadow-blue-500/30">
                        P1
                    </div>
                    <div>
                        <h2 class="font-bold text-sm leading-tight tracking-wide">Player_1</h2>
                        <p class="text-xs text-blue-200 font-semibold">Lvl 42</p>
                    </div>
                </div>

                <!-- Stats (Score & Time) -->
                <div class="glass-panel p-2 px-4 rounded-2xl flex flex-col items-end gap-1 text-right">
                     <div>
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Score</p>
                        <p class="text-sm font-mono font-bold">14,250</p>
                    </div>
                     <div>
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Time</p>
                        <p class="text-sm font-mono text-yellow-400 font-bold">12:45</p>
                    </div>
                </div>
            </div>

            <!-- Center Action / Message -->
            <div class="text-center mt-10">
                <h1 class="text-4xl font-extrabold tracking-widest uppercase drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-500">
                    Mission<br>Active
                </h1>
                <p class="text-sm font-medium text-gray-300 drop-shadow-md tracking-wider">Survive the incoming waves</p>
            </div>

            <!-- Bottom Controls: Stacked for 9:16 layout -->
            <div class="flex flex-col gap-3 pb-6 w-full">
                
                <!-- Main Start Button -->
                <button class="interactive-element w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 transition-all duration-300 font-bold text-lg tracking-widest text-white shadow-lg btn-pulse">
                    START GAME
                </button>
                
                <!-- Secondary Buttons Row -->
                <div class="flex justify-between gap-3 w-full">
                    <button class="interactive-element glass-panel flex-1 py-3 rounded-2xl hover:bg-white/20 transition-all duration-300 font-semibold tracking-wide flex justify-center items-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287-.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                        </svg>
                        Settings
                    </button>
                    <button class="interactive-element glass-panel flex-1 py-3 rounded-2xl hover:bg-white/20 transition-all duration-300 font-semibold tracking-wide flex justify-center items-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 3a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2H5zm0 2h10v7h-2l-1 2H8l-1-2H5V5z" clip-rule="evenodd" />
                        </svg>
                        Inventory
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Handle button clicks with a modern custom popup instead of alert()
        document.querySelectorAll('.interactive-element').forEach(button => {
            button.addEventListener('click', (e) => {
                // Determine button text or name
                let btnName = e.currentTarget.innerText.trim();
                if (!btnName) btnName = "Icon Button";

                const msgBox = document.createElement('div');
                // Creating a modern mobile-style popup notification
                msgBox.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-gray-900/95 text-white p-6 rounded-2xl border border-gray-700 z-50 text-center shadow-2xl w-64 interactive-element backdrop-blur-md';
                msgBox.innerHTML = `
                    <div class="mb-4">
                        <h3 class="text-lg font-bold text-blue-400 mb-1">${btnName}</h3>
                        <p class="text-sm text-gray-300">Action recorded successfully.</p>
                    </div>
                    <button class="w-full py-2 bg-white/10 hover:bg-white/20 rounded-xl transition-colors font-medium text-sm border border-white/10" onclick="this.parentElement.remove()">Dismiss</button>
                `;
                document.body.appendChild(msgBox);
            });
        });
    </script>
</body>
</html>
